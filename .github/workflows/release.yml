name: Release

# Push a tag equal to the version in manifest.json (e.g. 1.0.0) to publish a release
# with the files Obsidian downloads: main.js, manifest.json, styles.css.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write          # create the release
  id-token: write          # sign the attestation (Sigstore)
  attestations: write      # store the attestation
  artifact-metadata: write # artifact storage record

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          VERSION=$(jq -r .version manifest.json)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "main.js, manifest.json, styles.css"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
